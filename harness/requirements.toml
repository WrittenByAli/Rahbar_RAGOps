# Single source of truth for what "done" means.
#
# Every [[req]] with origin = "assignment" carries a VERBATIM quote from the Assignment 03 PDF.
# `python harness/verify.py --lint --spec <pdf>` checks each quote against the PDF.
# Rows with origin = "plan" are prerequisites found during gap analysis (docs/a3/GAP-ANALYSIS.md).
#
# kind: auto  = a machine check decides
#       mixed = machine check AND a human attestation
#       human = only a human can do it (an agent must never attest or fabricate it)
#
# Stages: "build" checks need only source; "evidence" checks need data or real runs.
#
# Do not weaken a check to make it pass. Check changes need both members' review.

[meta]
assignment = "Assignment 03 - RAGOps (CS4032, Fall 26)"
