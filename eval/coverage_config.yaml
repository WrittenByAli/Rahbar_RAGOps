# Coverage check configuration (E2, E4.2).
#
# This file is read by eval/coverage.py. It is committed BEFORE any coverage run so that
# the threshold choice is not influenced by seeing a coverage share first. The result file
# records config_sha256, so the order can be verified in git history.
#
# How the threshold was chosen:
# nomic-embed-text cosine similarity between module-pair positives (questions about the same
# policy area that should retrieve the same chunks) scores 0.80-0.95. A live query whose
# nearest golden question scores below 0.75 is asking about a different subject. 0.75 is
# one standard deviation below the lower end of the module-pair distribution, so a query
# that is genuinely on-topic should clear it.
#
# How the required_share was chosen:
# 42 live queries; 13 are explicitly about hostel rooms, parking and student visas, which
# are not in corpus A and therefore have no golden question. The remaining 29 should be
# covered by the 26 golden questions. A required_share of 0.70 (30 of 42 covered) is
# achievable before adding new questions and becomes the floor: the "after" run with at
# least 6 new coverage questions must pass this same threshold.

threshold_similarity: 0.75
threshold_justification: >-
  0.75 is below the lower end of the module-pair cosine similarity distribution (0.80-0.95
  with nomic-embed-text). A live query scoring below this against every golden question is
  asking about a topic the golden set does not cover.
required_share: 0.70
