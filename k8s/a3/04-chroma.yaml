apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar-a3
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      automountServiceAccountToken: false
      # A Service named chroma would inject CHROMA_PORT=tcp://..., which the server cannot parse.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12
          ports:
            - containerPort: 8000
          env:
            - {name: IS_PERSISTENT, value: "TRUE"}
            - {name: ANONYMIZED_TELEMETRY, value: "FALSE"}
            - {name: PERSIST_DIRECTORY, value: /data}
          volumeMounts:
            - {name: chroma-data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          # PROVISIONAL until measured (plan T8.6).
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "768Mi"}
          readinessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            failureThreshold: 18
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: rahbar-a3
spec:
  selector:
    app: chroma
  ports:
    - {port: 8000, targetPort: 8000}
