apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-gate-thresholds
  namespace: rahbar-a3
data:
  gate.yaml: |
    rules:
      recall_at_5:
        limit: 0.05
        justification: >-
          Unchanged from the committed thresholds.
      faithfulness:
        limit: 0.80
        justification: >-
          Unchanged from the committed thresholds.
      latency_ms_p95:
        limit: 3000
        justification: >-
          Strict demo threshold. S0 p95 was 3068 ms (run 1) and 3589 ms (run 2). A
          limit of 3000 ms (below the baseline run 1 p95) means the candidate must be
          faster than the baseline — it fails the S1 Batch B candidate (3842 ms).
          This file is used only to demonstrate that changing the ConfigMap changes the
          gate outcome without rebuilding the image (F2 / F3 demo).
      abstention_correctness:
        limit: 0
        justification: >-
          Unchanged from the committed thresholds.
      answerable_answer_rate:
        limit: 0.55
        justification: >-
          Unchanged from the committed thresholds.
