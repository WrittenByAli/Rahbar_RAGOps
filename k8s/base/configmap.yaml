apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  RETRIEVER: "stub"
  LLM_PROVIDER: "stub"
  EMBED_MODEL: "dummy-768"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  TOP_K: "5"
  # Temperature 0 and a fixed seed, so two evaluation runs are comparable (B.S).
  TEMPERATURE: "0.0"
  LLM_SEED: "42"
  # Part of the cache key and of every trace. Change them with the pipeline configuration.
  RELEASE_ID: "v1"
  PROMPT_VERSION: "p1"
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  CORPUS_DIR: "/corpus"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://redis:6379"
  RELEVANCE_FLOOR: "0.55"
  CACHE_THRESHOLD: "0.92"
